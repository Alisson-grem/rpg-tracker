<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre da Forja - Iniciativa D&D</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="pergaminho">
        <div class="cabecalho-rpg">
            <h1>Rastreador de Sangue & Iniciativa</h1>
            <p>Role os dados. O destino não perdoa.</p>
        </div>

        <!-- O Lançador de Dados do Mestre -->
        <div class="sessao-dados">
            <h2 class="titulo-sessao">🎲 Lançar Dados</h2>
            <div class="forja-dados">
                <input type="number" id="qtdDados" value="1" min="1" title="Quantidade">
                <span class="simbolo">d</span>
                <select id="tipoDado">
                    <option value="4">4</option>
                    <option value="6">6</option>
                    <option value="8">8</option>
                    <option value="10">10</option>
                    <option value="12">12</option>
                    <option value="20" selected>20</option>
                    <option value="100">100</option>
                </select>
                <span class="simbolo">x</span>
                <input type="number" id="multDado" value="1" min="1" title="Multiplicador">
                <span class="simbolo">+</span>
                <input type="number" id="modDado" value="0" title="Modificador Extra">
                <button class="btn-rpg btn-rolar" onclick="rolarDados()">Rolar!</button>
            </div>
            <div id="resultadoDado" class="resultado-dado escondido"></div>
        </div>

        <!-- Adicionar Combatente -->
        <div class="sessao-adicionar">
            <h2 class="titulo-sessao">⚔️ Convocar Combatente</h2>
            <div class="forja-combatente">
                <input type="text" id="nomeComb" placeholder="Nome (Ex: Goblin Furioso)" autocomplete="off">
                <input type="number" id="iniComb" placeholder="Iniciativa" autocomplete="off">
                <input type="number" id="hpComb" placeholder="HP Máximo" autocomplete="off">
                <button class="btn-rpg" onclick="adicionarCombatente()">Invocar</button>
            </div>
        </div>

        <!-- Campo de Batalha (Lista) -->
        <div class="sessao-batalha">
            <div class="batalha-header">
                <h2 class="titulo-sessao">🩸 Campo de Batalha</h2>
                <button class="btn-rpg-pequeno btn-limpar" onclick="limparBatalha()">Limpar Mesa</button>
            </div>
            
            <ul id="listaIniciativa" class="lista-combatentes">
                <!-- Os combatentes aparecem aqui -->
            </ul>
        </div>

        <!-- O Baú do Mestre (Pix) -->
        <div class="area-pix-rodape">
            <p>O Mestre poupou sua vida hoje?</p>
            <button class="btn-rpg btn-pix" onclick="abrirModalPix()">
                💰 Jogar Moeda no Baú (Pix)
            </button>
        </div>
    </div>

    <!-- Modal do Pix Escondido -->
    <div id="modalPix" class="modal escondido">
        <div class="modal-caixa">
            <button class="btn-fechar-cruz" onclick="fecharModalPix()">✖</button>
            <h2 class="titulo-pix">Baú do Mestre</h2>
            <p>Faça uma oferenda para que os dados rolem a seu favor:</p>
            <div class="area-qr">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=00020126440014br.gov.bcb.pix0122siteforgeagp@gmail.com5204000053039865802BR5910SITEFORGER6009Sao Paulo610901227-20062350531daqr37805573181792507998929594663045175" alt="QR Code Pix" class="img-qr">
            </div>
            <p class="ou-texto">Ou copie as runas:</p>
            <div class="area-copia">
                <input type="text" id="inputChavePix" value="siteforgeagp@gmail.com" readonly>
                <button id="btnCopiarPix" class="btn-rpg-pequeno" onclick="copiarChavePix()">Copiar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
